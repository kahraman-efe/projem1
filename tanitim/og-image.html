<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Paylaşım Önizleme Görseli</title>
<link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@600;800&family=Inter:wght@500;600&display=swap" rel="stylesheet">
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 1200px; height: 630px; background: #16191f; }
    .og {
        position: relative;
        width: 1200px; height: 630px;
        overflow: hidden;
        display: flex;
        align-items: center;
        gap: 64px;
        padding: 0 90px;
        font-family: "Inter", "Segoe UI", sans-serif;
        color: #dfe6f0;
        background:
            radial-gradient(520px 420px at 280px 315px, rgba(59,156,255,.32), transparent 70%),
            radial-gradient(500px 400px at 1200px 0, rgba(59,156,255,.14), transparent 70%),
            linear-gradient(135deg, #14171d 0%, #22262e 60%, #2b3039 100%);
    }
    .og::before {
        content: "";
        position: absolute; inset: 0;
        background-image:
            linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px),
            linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px);
        background-size: 48px 48px;
    }
    .logo {
        position: relative;
        flex-shrink: 0;
        width: 360px;
        padding: 9px;
        border-radius: 34px;
        background: linear-gradient(145deg, rgba(255,255,255,.22), rgba(59,156,255,.45));
        box-shadow: 0 40px 90px -25px rgba(59,156,255,.85);
    }
    .logo img { display: block; width: 100%; border-radius: 26px; }
    .text { position: relative; }
    .badge {
        display: inline-flex; align-items: center; gap: 12px;
        padding: 10px 22px;
        border-radius: 999px;
        border: 1px solid rgba(52,211,153,.6);
        background: rgba(52,211,153,.1);
        font: 600 22px/1 "Inter", sans-serif;
        color: #c9f5e3;
    }
    .badge i { width: 12px; height: 12px; border-radius: 50%; background: #34d399; box-shadow: 0 0 0 6px rgba(52,211,153,.2); }
    h1 { margin-top: 26px; font: 800 64px/1.05 "Exo 2", sans-serif; color: #fff; }
    h2 { margin-top: 14px; font: 600 32px/1.25 "Exo 2", sans-serif; color: #7cc0ff; }
    p { margin-top: 22px; font-size: 24px; line-height: 1.5; color: #b9c4d3; }
    .url { margin-top: 30px; font: 600 24px/1 "Inter", sans-serif; color: #fff; letter-spacing: .5px; }
</style>
</head>
<body>
<div class="og">
    <div class="logo"><img src="../WebApplication4/wwwroot/hola-master/images/erdenlogo1.jpg" alt=""></div>
    <div class="text">
        <span class="badge"><i></i> Staja açığım · Open to internships</span>
        <h1>Kahraman Efe Erden</h1>
        <h2>Yazılım Geliştirici · Erden Yazılım</h2>
        <p>Kurumsal web sitesi, hosting, domain<br>ve yapay zeka çözümleri</p>
        <div class="url">kahramanefe.com.tr</div>
    </div>
</div>
</body>
</html>
